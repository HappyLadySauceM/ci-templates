[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-templates"
version = "1.1.7"
description = "Reusable Python CI/CD control plane for HappyLadySauce projects"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
ci-templates = "ci_templates.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
