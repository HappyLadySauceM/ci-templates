name: Upload artifact with retry
description: Upload a stable artifact twice before failing the job
inputs:
  name:
    description: Stable artifact name within the run
    required: true
  path:
    description: Files to upload
    required: true
  retention-days:
    description: Retention in days
    default: "3"
  if-no-files-found:
    description: Missing-file behavior
    default: error
  compression-level:
    description: Zip compression level
    default: "6"
  include-hidden-files:
    description: Include hidden files
    default: "false"
outputs:
  artifact-id:
    description: Uploaded artifact identifier
    value: ${{ steps.result.outputs.artifact-id }}
  artifact-url:
    description: Uploaded artifact URL
    value: ${{ steps.result.outputs.artifact-url }}
  artifact-digest:
    description: Uploaded artifact digest
    value: ${{ steps.result.outputs.artifact-digest }}
  attempt-count:
    description: Number of complete upload attempts
    value: ${{ steps.result.outputs.attempt-count }}
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: sleep 10
    - id: second
      if: steps.first.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - id: result
      shell: bash
      env:
        FIRST_OUTCOME: ${{ steps.first.outcome }}
        FIRST_ID: ${{ steps.first.outputs.artifact-id }}
        FIRST_URL: ${{ steps.first.outputs.artifact-url }}
        FIRST_DIGEST: ${{ steps.first.outputs.artifact-digest }}
        SECOND_ID: ${{ steps.second.outputs.artifact-id }}
        SECOND_URL: ${{ steps.second.outputs.artifact-url }}
        SECOND_DIGEST: ${{ steps.second.outputs.artifact-digest }}
      run: |
        if [[ "$FIRST_OUTCOME" == success ]]; then
          printf 'artifact-id=%s\nartifact-url=%s\nartifact-digest=%s\nattempt-count=1\n' "$FIRST_ID" "$FIRST_URL" "$FIRST_DIGEST" >> "$GITHUB_OUTPUT"
        else
          printf 'artifact-id=%s\nartifact-url=%s\nartifact-digest=%s\nattempt-count=2\n' "$SECOND_ID" "$SECOND_URL" "$SECOND_DIGEST" >> "$GITHUB_OUTPUT"
        fi
