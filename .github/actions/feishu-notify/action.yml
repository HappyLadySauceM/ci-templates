name: Feishu Notify
description: Convert a GitHub event into a signed Feishu custom-bot card

inputs:
  webhook:
    description: Feishu custom bot webhook URL
    required: true
  secret:
    description: Feishu custom bot signature secret
    required: true
  card:
    description: Set to ci for pipeline/publish/CI end-of-run summary cards
    required: false
    default: ""
  conclusion:
    description: Override run conclusion for same-workflow notify jobs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Feishu card
      # Send a signed interactive card for the current GitHub event.
      # 把当前 GitHub 事件打成带签名的飞书卡片。
      shell: bash
      env:
        FEISHU_WEBHOOK_URL: ${{ inputs.webhook }}
        FEISHU_WEBHOOK_SECRET: ${{ inputs.secret }}
        FEISHU_CARD_KIND: ${{ inputs.card }}
        FEISHU_CONCLUSION: ${{ inputs.conclusion }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/notify.py"
