name: Checkout with retry
description: Retry checkout once after cleaning an incomplete worktree
inputs:
  fetch-depth: { default: "1" }
  ref: { default: "" }
  repository: { default: "${{ github.repository }}" }
  token: { default: "${{ github.token }}" }
  path: { default: "" }
  fetch-tags: { default: "false" }
  persist-credentials: { default: "true" }
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-tags: ${{ inputs.fetch-tags }}
        persist-credentials: ${{ inputs.persist-credentials }}
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: git reset --hard HEAD 2>/dev/null || true; git clean -ffdx 2>/dev/null || true
    - if: steps.first.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-tags: ${{ inputs.fetch-tags }}
        persist-credentials: ${{ inputs.persist-credentials }}
