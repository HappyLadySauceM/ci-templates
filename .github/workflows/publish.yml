name: ci-templates-publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - VERSION
      - README.md
      - src/**
      - tests/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-templates-publish-main
  cancel-in-progress: false

env:
  CI_IMAGE: harbor.happyladysauce.local/knowledge-core/ci-templates

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, devops]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run template tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src

      - name: Prepare Harbor credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/ci-templates-harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/ci-templates-harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/ci-templates-harbor/ca.crt"
          test -s "$RUNNER_TEMP/ci-templates-harbor/config.json"
          test -s "$RUNNER_TEMP/ci-templates-harbor/ca.crt"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/ci-templates-harbor" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/ci-templates-harbor/ca.crt" >> "$GITHUB_ENV"

      - name: Build and push versioned control image
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in
            ''|*[!0-9.]*|.*|*.)
              echo "invalid VERSION: $version" >&2
              exit 1
              ;;
          esac
          image="$CI_IMAGE:v$version"
          if docker pull "$image" >/dev/null 2>&1; then
            echo "Published image already exists: $image"
            exit 0
          fi
          docker build --network host --tag "$image" .
          push_output="$(docker push "$image" 2>&1 | tee /dev/stderr)"
          digest="$(awk '/: digest: sha256:/ {sub(/^.*digest: /, ""); sub(/ .*/, ""); print; exit}' <<<"$push_output")"
          test -n "$digest"
          echo "Published $image@$digest"
          {
            echo "### Published control image"
            echo
            echo '\`'"$image@$digest"'\`'
          } >> "$GITHUB_STEP_SUMMARY"
