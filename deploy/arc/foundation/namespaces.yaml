apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    app.kubernetes.io/part-of: actions-runner-controller
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-standard
  labels:
    app.kubernetes.io/part-of: actions-runner-controller
    # Privileged namespace is required for hostPath caches. Both baseline
    # and restricted forbid hostPath; a local PV is ReadWriteOnce and cannot
    # be shared by four concurrent runners. Runner pods stay non-root with
    # ALL dropped and are not privileged containers.
    # namespace 必须 privileged 才能挂 hostPath 缓存。baseline 与 restricted
    # 都禁止 hostPath；local PV 为 RWO，无法给 4 个并发 runner 共用。
    # Runner 容器仍非 root、drop ALL，且不是 privileged 容器。
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-builder
  labels:
    app.kubernetes.io/part-of: actions-runner-controller
    # Only the builder pool may run the privileged Docker-in-Docker sidecar.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
