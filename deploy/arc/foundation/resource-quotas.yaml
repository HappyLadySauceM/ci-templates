apiVersion: v1
kind: ResourceQuota
metadata:
  name: hls-standard-pool
  namespace: arc-runners-standard
spec:
  hard:
    pods: "12"
    requests.cpu: "32"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hls-builder-pool
  namespace: arc-runners-builder
spec:
  hard:
    pods: "10"
    requests.cpu: "64"
    requests.memory: 40Gi
    # 8 × (DinD 4 + runner 4 + init 500m) = 68 CPU;
    # 8 × (4Gi + 1Gi + 256Mi) = 42Gi. Requests stay 64/40Gi.
    # 8 × (DinD 4 + runner 4 + init 500m) = 68 CPU；
    # 8 × (4Gi + 1Gi + 256Mi) = 42Gi。request 配额仍是 64/40Gi。
    limits.cpu: "68"
    limits.memory: 42Gi
