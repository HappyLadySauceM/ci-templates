# Values for actions-runner-controller/gha-runner-scale-set.
githubConfigUrl: https://github.com/HappyLadySauceM
githubConfigSecret: arc-github-app
runnerGroup: happyladysauce-ci
runnerScaleSetName: hls-builder
scaleSetLabels:
  - hls-builder
controllerServiceAccount:
  namespace: arc-system
  name: gha-runner-scale-set-controller-gha-rs-controller
minRunners: 0
# Eight builders share the namespace limit quota. Per-pod limits are
# DinD 4/4Gi plus runner 4/1Gi plus init 500m/256Mi (ResourceQuota
# with limits.* requires every container, including init, to set
# limits). Requests stay lower so they can schedule beside standard.
# 8 个 builder 共用 namespace limit 配额。每 Pod limit 为 DinD 4/4Gi
# 加 runner 4/1Gi 加 init 500m/256Mi（配额一旦写了 limits.*，含 init
# 在内的每个容器都必须带 limit）。request 更低，才能和 standard 一起调度。
maxRunners: 8
imagePullSecrets:
  - name: arc-registry-pull
containerMode: {}
listenerTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: listener
        envFrom:
          - secretRef:
              name: arc-proxy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
template:
  metadata:
    labels:
      workload.happyladysauce.local/pool: builder
  spec:
    securityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: hls-builder-runner
    nodeSelector:
      workload.happyladysauce.local/ci: "true"
    tolerations:
      - key: workload.happyladysauce.local/ci
        operator: Equal
        value: "true"
        effect: NoSchedule
    initContainers:
      - name: init-dind-externals
        image: harbor.happyladysauce.local/infrastructure/hls-actions-runner:2.337.0-r7
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        resources:
          # ResourceQuota hard limits.cpu/memory require every container
          # to set limits, including this short-lived copy init.
          # ResourceQuota 一旦写了 limits.cpu/memory，含这个短命拷贝
          # init 在内的每个容器都必须带 limit。
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: dind
        image: docker:28.3.3-dind@sha256:a56b3bdde89315ed2cc0e4906e582b5033d93bf20d9cb9510c2cdd4e7f7690b1
        args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=$(DOCKER_GROUP_GID)"]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        envFrom:
          - secretRef:
              name: arc-proxy
        securityContext:
          privileged: true
        resources:
          requests:
            # Quoted CPU so Helm/YAML keep a string. Align with the runner
            # cgroup so build_jobs() matches BuildKit. Request is half of
            # limit so eight builders can schedule beside standard.
            # CPU 必须加引号。与 runner cgroup 对齐，让 build_jobs() 和 BuildKit 一致。
            # request 是 limit 的一半，8 个 builder 才能和 standard 一起调度。
            cpu: "2"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: harbor-ca
            mountPath: /etc/docker/certs.d/harbor.happyladysauce.local/ca.crt
            subPath: ca.crt
            readOnly: true
      - name: runner
        image: harbor.happyladysauce.local/infrastructure/hls-actions-runner:2.337.0-r5
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          # Buildx docker-container driver image mirrored from
          # moby/buildkit:buildx-stable-1; keep the digest immutable.
          # Buildx docker-container driver 使用 Harbor 内部镜像，固定 digest。
          - name: BUILDKIT_IMAGE
            value: harbor.happyladysauce.local/knowledge-core/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Same node-local caches as hls-standard.
          # 与 hls-standard 共用节点本地缓存。
          - name: CARGO_HOME
            value: /cache/cargo
          - name: GOMODCACHE
            value: /cache/go/mod
          - name: GOCACHE
            value: /cache/go/build
          - name: NPM_CONFIG_CACHE
            value: /cache/npm
          - name: PLAYWRIGHT_BROWSERS_PATH
            value: /cache/playwright
          - name: RUNNER_TOOL_CACHE
            value: /cache/actions-tools
        envFrom:
          - secretRef:
              name: arc-proxy
        resources:
          requests:
            # Keep the runner cgroup aligned with the DIND daemon so
            # build_jobs() sees the CPUs that BuildKit can actually use.
            # runner cgroup 与 DinD 对齐，build_jobs() 才能看到 BuildKit 实际可用的核。
            cpu: "2"
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: harbor-ca
            mountPath: /etc/docker/certs.d/harbor.happyladysauce.local/ca.crt
            subPath: ca.crt
            readOnly: true
          - name: ci-cache
            mountPath: /cache
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 50Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: harbor-ca
        secret:
          secretName: arc-registry-ca
      - name: ci-cache
        hostPath:
          path: /var/lib/hls-ci-cache
          type: DirectoryOrCreate
