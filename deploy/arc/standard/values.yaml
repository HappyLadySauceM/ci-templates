# Values for actions-runner-controller/gha-runner-scale-set.
githubConfigUrl: https://github.com/HappyLadySauceM
githubConfigSecret: arc-github-app
runnerGroup: happyladysauce-ci
runnerScaleSetName: hls-standard
scaleSetLabels:
  - hls-standard
controllerServiceAccount:
  namespace: arc-system
  name: gha-runner-scale-set-controller-gha-rs-controller
minRunners: 1
# Single-node standard pool cap: five runners at 6 GiB each. Add dedicated CI
# workers before increasing this limit further.
maxRunners: 5
imagePullSecrets:
  - name: arc-registry-pull
containerMode: {}
listenerTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: listener
        envFrom:
          - secretRef:
              name: arc-proxy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
template:
  metadata:
    labels:
      workload.happyladysauce.local/pool: standard
  spec:
    serviceAccountName: hls-standard-runner
    nodeSelector:
      workload.happyladysauce.local/ci: "true"
    tolerations:
      - key: workload.happyladysauce.local/ci
        operator: Equal
        value: "true"
        effect: NoSchedule
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: harbor.happyladysauce.local/infrastructure/hls-actions-runner:2.337.0-r2
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "1"
            memory: 6Gi
          limits:
            cpu: "1"
            memory: 6Gi
        envFrom:
          - secretRef:
              name: arc-proxy
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
