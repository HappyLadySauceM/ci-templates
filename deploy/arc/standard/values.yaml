# Values for actions-runner-controller/gha-runner-scale-set.
githubConfigUrl: https://github.com/HappyLadySauceM
githubConfigSecret: arc-github-app
runnerGroup: happyladysauce-ci
runnerScaleSetName: hls-standard
scaleSetLabels:
  - hls-standard
controllerServiceAccount:
  namespace: arc-system
  name: gha-runner-scale-set-controller-gha-rs-controller
minRunners: 1
# Eight runners. Each has a 4 CPU scheduling guarantee and can burst to 8 CPU
# for Rust and Go compilation. Namespace CPU limit quota is 64 CPU.
# 8 个 runner。每个有 4 CPU 调度保底，Rust/Go 编译可突发至 8 CPU；
# namespace CPU limit 配额为 64 CPU。
maxRunners: 8
imagePullSecrets:
  - name: arc-registry-pull
containerMode: {}
listenerTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: listener
        envFrom:
          - secretRef:
              name: arc-proxy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
template:
  metadata:
    labels:
      workload.happyladysauce.local/pool: standard
  spec:
    serviceAccountName: hls-standard-runner
    nodeSelector:
      workload.happyladysauce.local/ci: "true"
    tolerations:
      - key: workload.happyladysauce.local/ci
        operator: Equal
        value: "true"
        effect: NoSchedule
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: harbor.happyladysauce.local/infrastructure/hls-actions-runner:2.337.0-r7
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 8Gi
        env:
          # Node-local caches; do not use GitHub Actions cache (uploads off-cluster).
          # 节点本地缓存；不要用 GitHub Actions cache（会上传到集群外）。
          - name: CARGO_HOME
            value: /cache/cargo
          - name: GOMODCACHE
            value: /cache/go/mod
          - name: GOCACHE
            value: /cache/go/build
          - name: NPM_CONFIG_CACHE
            value: /cache/npm
          - name: PLAYWRIGHT_BROWSERS_PATH
            value: /cache/playwright
          - name: RUNNER_TOOL_CACHE
            value: /cache/actions-tools
        envFrom:
          - secretRef:
              name: arc-proxy
        volumeMounts:
          - name: ci-cache
            mountPath: /cache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
    volumes:
      - name: ci-cache
        hostPath:
          path: /var/lib/hls-ci-cache
          type: DirectoryOrCreate
